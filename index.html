<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ninero-nero</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ninero-nero">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --card2: #F2F2F7;
  --text: #1C1C1E;
  --text2: rgba(60, 60, 67, .62);
  --text3: rgba(60, 60, 67, .32);
  --sep: rgba(60, 60, 67, .16);
  --fill: rgba(120, 120, 128, .12);
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --pa: #5E5CE6;
  --pb: #FF375F;
  --bar: rgba(249, 249, 249, .86);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04);
  --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --card2: #2C2C2E;
    --text: #FFFFFF;
    --text2: rgba(235, 235, 245, .6);
    --text3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .55);
    --fill: rgba(118, 118, 128, .24);
    --blue: #0A84FF;
    --green: #30D158;
    --orange: #FF9F0A;
    --red: #FF453A;
    --bar: rgba(22, 22, 24, .86);
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 17px; line-height: 1.35; letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* Layout */
.page { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 120px); }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 4px 14px; }
.title { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; }
.title small { display: block; font-size: 15px; font-weight: 500; color: var(--text2); letter-spacing: -.01em; margin-bottom: 2px; }
.month-nav { display: flex; gap: 4px; align-items: center; }
.icon-btn { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; background: var(--fill); color: var(--blue); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[disabled] { opacity: .35; }
.section-title { font-size: 20px; font-weight: 700; margin: 26px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title a, .link { font-size: 15px; font-weight: 500; color: var(--blue); text-decoration: none; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.card + .card { margin-top: 12px; }
.pad { padding: 16px; }
.muted { color: var(--text2); }
.small { font-size: 13px; }
.sub { font-size: 15px; color: var(--text2); }

/* Balance hero */
.hero { padding: 20px 18px 18px; }
.hero-line { font-size: 17px; color: var(--text2); }
.hero-line b { color: var(--text); font-weight: 600; }
.hero-amount { font-size: 54px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin: 4px 0 2px; }
.hero-amount.peace { font-size: 40px; }
.tug { margin: 18px 0 10px; }
.tug-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--fill); gap: 3px; }
.tug-bar span { display: block; height: 100%; border-radius: 7px; transition: flex-grow .5s cubic-bezier(.2, .8, .2, 1); min-width: 14px; }
.tug-mid { position: relative; height: 0; }
.tug-mid::after { content: ""; position: absolute; left: 50%; top: -20px; width: 2px; height: 20px; background: var(--card); transform: translateX(-1px); }
.tug-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 15px; }
.tug-legend div:last-child { text-align: right; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; vertical-align: 1px; }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: .5px solid var(--sep); margin: 16px -18px -18px; padding: 12px 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; }
.pill.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.pill.wait { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.pill.even { background: var(--fill); color: var(--text2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 17px; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.tinted { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.btn.danger { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.btn.small { font-size: 15px; padding: 8px 14px; border-radius: 99px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .5; }
.warn { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--orange); padding: 10px 18px 0; }

/* Rows */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: .5px solid var(--sep); }
.row.plain + .row.plain::before { left: 16px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-size: 17px; font-weight: 500; white-space: nowrap; }
.chev { color: var(--text3); width: 8px; height: 13px; flex: none; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; flex: none; }
.who { width: 8px; height: 8px; border-radius: 4px; display: inline-block; margin-right: 5px; vertical-align: 1px; }
.datebox { width: 44px; flex: none; text-align: center; line-height: 1.05; }
.datebox b { display: block; font-size: 22px; font-weight: 600; }
.datebox span { font-size: 12px; color: var(--red); font-weight: 600; }
.empty { padding: 26px 18px; text-align: center; color: var(--text2); font-size: 15px; }

/* Fijos card */
.fx { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fx .big { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.progress { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 12px; }
.progress span { display: block; height: 100%; background: var(--green); border-radius: 3px; }

/* Donut */
.donut-wrap { display: flex; gap: 18px; align-items: center; padding: 18px; }
.donut { width: 132px; height: 132px; flex: none; }
.legend { flex: 1; min-width: 0; display: grid; gap: 8px; font-size: 15px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .v { color: var(--text2); }

/* Fijos form */
.frow { display: flex; align-items: center; gap: 10px; padding: 6px 16px; min-height: 50px; position: relative; }
.frow + .frow::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
.frow label { flex: 1; min-width: 0; }
.frow input { width: 110px; text-align: right; border: 0; background: var(--fill); border-radius: 9px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.frow input::placeholder { color: var(--text3); }
.frow .del { color: var(--red); width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; }

/* Calendar */
.cal { padding: 8px 10px 14px; }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; font-weight: 600; color: var(--text2); text-align: center; padding: 6px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
.day { aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; font-size: 17px; position: relative; }
.day.out { color: var(--text3); }
.day.today .n { color: var(--red); font-weight: 700; }
.day.sel .n { background: var(--text); color: var(--card); }
.day.today.sel .n { background: var(--red); color: #fff; }
.day .n { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 3px; background: var(--blue); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-bottom: var(--safe-b); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; font-size: 10.5px; font-weight: 500; color: var(--text2); }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--blue); }
.fab { position: fixed; z-index: 21; right: max(18px, calc(50% - 262px)); bottom: calc(var(--safe-b) + 72px); width: 58px; height: 58px; border-radius: 29px; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--blue) 40%, transparent); }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.94); }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .32); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 14px 14px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding: 8px 16px calc(var(--safe-b) + 20px); }
.sheet.on { transform: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 0 auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 14px; min-height: 36px; }
.sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
.sheet-head .link { min-width: 70px; }
.sheet-head .link.r { text-align: right; font-weight: 600; }
.amount-in { width: 100%; text-align: center; font-size: 52px; font-weight: 700; border: 0; background: none; padding: 8px 0 2px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.amount-in:focus, .amount-in:focus-visible { outline: none; }
.amount-in::placeholder { color: var(--text3); }
.split-hint { text-align: center; font-size: 15px; color: var(--text2); min-height: 20px; margin-bottom: 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 16px; }
.seg button { padding: 7px 0; border-radius: 7px; font-size: 15px; font-weight: 500; }
.seg button.on { background: var(--card); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 99px; background: var(--card); font-size: 15px; border: 1.5px solid transparent; }
.chip.on { border-color: var(--c, var(--blue)); background: color-mix(in srgb, var(--c, var(--blue)) 14%, var(--card)); font-weight: 600; }
.field { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 0 16px; min-height: 48px; position: relative; }
.field:first-child { border-radius: 12px 12px 0 0; }
.field:last-child { border-radius: 0 0 12px 12px; }
.field:only-child { border-radius: 12px; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.field label { width: 96px; flex: none; }
.field input, .field select { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; text-align: right; }
.field input[type=date] { -webkit-appearance: none; appearance: none; min-height: 24px; }
.fields { margin-bottom: 16px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0 12px; }
.swatch { width: 30px; height: 30px; border-radius: 15px; border: 3px solid var(--card); box-shadow: 0 0 0 1.5px transparent; }
.swatch.on { box-shadow: 0 0 0 2px var(--text); }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .2s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }

/* Auth */
.auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px); max-width: 420px; margin: 0 auto; text-align: center; }
.logo { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
.auth h1 { font-size: 30px; margin: 0 0 6px; }
.auth p { color: var(--text2); margin: 0 0 24px; font-size: 16px; }
.auth .fields { width: 100%; text-align: left; }
.people { display: grid; gap: 12px; width: 100%; }
.person { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card); border-radius: 14px; font-size: 19px; font-weight: 600; text-align: left; }
.avatar { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 19px; flex: none; }
.pin-dots { display: flex; gap: 16px; justify-content: center; margin: 18px 0 30px; height: 14px; }
.pin-dots i { width: 13px; height: 13px; border-radius: 7px; border: 1.5px solid var(--text); }
.pin-dots i.f { background: var(--text); }
.pin-dots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; justify-content: center; }
.key { width: 76px; height: 76px; border-radius: 38px; background: var(--fill); font-size: 32px; font-weight: 400; display: grid; place-items: center; }
.key:active { background: var(--text3); }
.key.ghost { background: none; font-size: 17px; font-weight: 500; }
.key.ok { background: none; font-size: 17px; font-weight: 600; color: var(--blue); }

/* Toast + loader */
.toast { position: fixed; z-index: 60; left: 50%; top: calc(var(--safe-t) + 12px); transform: translate(-50%, -220%); visibility: hidden; background: var(--card); color: var(--text); box-shadow: 0 8px 30px rgba(0, 0, 0, .18); padding: 12px 18px; border-radius: 99px; font-size: 15px; font-weight: 500; transition: transform .35s cubic-bezier(.2, .8, .2, 1), visibility .35s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.toast.bad { color: var(--red); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--fill); border-top-color: var(--blue); animation: spin .8s linear infinite; margin: 40vh auto 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy { position: fixed; top: calc(var(--safe-t) + 14px); right: 18px; z-index: 30; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fill); border-top-color: var(--blue); animation: spin .8s linear infinite; opacity: 0; transition: opacity .2s; }
.busy.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="spinner" aria-label="Cargando"></div></div>
<div class="busy" id="busy" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Configuración: pega aquí la URL del motor (termina en /exec).
   Si la dejas vacía, la app la pedirá la primera vez.
   ════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxz0An60jNRiVMfpK4jrpapEog32tfu6GTUKfhsBRiEyBw_Gz0fXEB8uZ-JNfrz_d_R/exec';

/* ───────────── Utilidades ───────────── */
const $ = s => document.querySelector(s);
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MES_CORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'];
const COLORES = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#30B0C7', '#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#A2845E', '#8E8E93'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function eur(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  const [e, d] = Math.abs(v).toFixed(2).split('.');
  const entero = e.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '−' : '') + (d === '00' ? entero : entero + ',' + d) + '\u00a0€';
}
const parseImporte = s => { const n = Number(String(s ?? '').trim().replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const mesNombre = m => MESES[Number(m.slice(5, 7)) - 1];
const mesLargo = m => cap(mesNombre(m)) + ' ' + m.slice(0, 4);
const sumarMes = (m, n) => { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const fechaCorta = f => Number(f.slice(8, 10)) + ' ' + MES_CORTO[Number(f.slice(5, 7)) - 1];
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function guardar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function cargar(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

const ICON = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

/* ───────────── Estado ───────────── */
const S = {
  api: API_URL || cargar('ninero.api') || '',
  sesion: cargar('ninero.sesion'),
  d: null,            // datos del mes visible
  mes: null,
  tab: 'inicio',
  fijos: null,        // fijos del mes que se edita
  fijosMes: null,
  fijosEdit: false,
  calMes: null,
  calDia: null,
  eventos: {},        // cache por mes YYYY-MM
  estado: null
};
const params = new URLSearchParams(location.search);
if (params.get('api')) { S.api = params.get('api'); guardar('ninero.api', S.api); history.replaceState(null, '', location.pathname); }

/* ───────────── API ───────────── */
let pendientes = 0;
async function api(accion, datos = {}, silencioso = false) {
  pendientes++; $('#busy').classList.add('on');
  try {
    const r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, datos, token: S.sesion && S.sesion.token }) });
    const j = await r.json();
    if (!j.ok) {
      if (j.sesion === false) { cerrarSesionLocal(); throw new Error('Tu sesión ha caducado. Vuelve a entrar.'); }
      throw new Error(j.error || 'Algo ha fallado.');
    }
    return j.datos;
  } catch (e) {
    const msg = e instanceof TypeError ? 'Sin conexión con el motor. Revisa tu conexión.' : e.message;
    if (!silencioso) toast(msg, true);
    throw new Error(msg);
  } finally {
    if (--pendientes === 0) $('#busy').classList.remove('on');
  }
}

let toastT;
function toast(msg, mal) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('bad', !!mal); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), mal ? 4200 : 2600);
}

/* ───────────── Arranque ───────────── */
async function iniciar() {
  if (!S.api) return pantallaApi();
  if (S.sesion) return cargarMes(S.mes);
  try { S.estado = await api('estado'); } catch (e) { return pantallaError(e.message); }
  pantallaAcceso();
}

function pantallaError(msg) {
  $('#app').innerHTML = `<div class="auth"><img class="logo" src="icon-180.png" alt=""><h1>No se pudo conectar</h1><p>${esc(msg)}</p>
    <button class="btn primary full" data-a="reintentar">Reintentar</button>
    <button class="btn full" style="color:var(--blue);margin-top:8px" data-a="cambiar-api">Cambiar la URL del motor</button></div>`;
}

function pantallaApi() {
  $('#app').innerHTML = `<div class="auth"><img class="logo" src="icon-180.png" alt=""><h1>Ninero-nero</h1>
    <p>Pega la URL del motor de Apps Script. Termina en <b>/exec</b>.</p>
    <div class="fields"><div class="field"><input id="api-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" style="text-align:left" autocomplete="off"></div></div>
    <button class="btn primary full" data-a="guardar-api">Continuar</button></div>`;
}

function avatar(p, size) {
  const i = S.estado ? S.estado.perfiles.findIndex(x => x.id === p.id) : 0;
  return `<span class="avatar" style="background:${i === 1 ? 'var(--pb)' : 'var(--pa)'}${size ? `;width:${size}px;height:${size}px;border-radius:${size / 2}px` : ''}">${esc(p.nombre.charAt(0).toUpperCase())}</span>`;
}

function pantallaAcceso() {
  const perfiles = S.estado.perfiles;
  if (perfiles.length === 0) return pantallaRegistro(true);
  $('#app').innerHTML = `<div class="auth"><img class="logo" src="icon-180.png" alt=""><h1>¿Quién eres?</h1><p>Entra con tu PIN.</p>
    <div class="people">${perfiles.map(p => `<button class="person" data-a="elegir-perfil" data-id="${esc(p.id)}">${avatar(p)}<span style="flex:1">${esc(p.nombre)}</span>${ICON.chev}</button>`).join('')}
    ${perfiles.length < S.estado.maxPerfiles ? `<button class="btn tinted full" data-a="registro">Crear el segundo perfil</button>` : ''}</div></div>`;
}

function pantallaRegistro(primero) {
  $('#app').innerHTML = `<div class="auth"><img class="logo" src="icon-180.png" alt=""><h1>${primero ? 'Bienvenidos' : 'Segundo perfil'}</h1>
    <p>Crea tu perfil. Cada uno entra con su propio PIN.</p>
    <div class="fields">
      <div class="field"><label for="r-nombre">Nombre</label><input id="r-nombre" maxlength="20" autocomplete="given-name" placeholder="Tu nombre"></div>
      <div class="field"><label for="r-pin">PIN</label><input id="r-pin" type="password" inputmode="numeric" maxlength="6" placeholder="4 a 6 números"></div>
      <div class="field"><label for="r-pin2">Repetir PIN</label><input id="r-pin2" type="password" inputmode="numeric" maxlength="6" placeholder="Otra vez"></div>
      <div class="field"><label for="r-email">Gmail</label><input id="r-email" type="email" autocomplete="email" placeholder="Opcional"></div>
    </div>
    <p class="small" style="margin:-6px 0 20px">Pon tu Gmail si no eres quien instaló la app: así recibes acceso al calendario compartido.</p>
    <button class="btn primary full" data-a="registrar">Crear perfil</button>
    ${primero ? '' : '<button class="btn full" style="color:var(--blue);margin-top:8px" data-a="volver-acceso">Cancelar</button>'}</div>`;
}

let pin = '', pinPerfil = null;
function pantallaPin(id) {
  pinPerfil = S.estado.perfiles.find(p => p.id === id); pin = '';
  const k = n => `<button class="key" data-a="pin" data-k="${n}">${n}</button>`;
  $('#app').innerHTML = `<div class="auth">${avatar(pinPerfil, 64)}<h1 style="margin-top:14px">Hola, ${esc(pinPerfil.nombre)}</h1><p>Introduce tu PIN</p>
    <div class="pin-dots" id="dots"></div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}<button class="key ghost" data-a="pin-borrar">Borrar</button>${k(0)}<button class="key ok" data-a="pin-ok">Entrar</button></div>
    <button class="btn" style="color:var(--blue);margin-top:24px" data-a="volver-acceso">Cambiar de persona</button></div>`;
  pintarDots();
}
function pintarDots() { const n = Math.max(4, pin.length); $('#dots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join(''); }

function cerrarSesionLocal() { S.sesion = null; S.d = null; guardar('ninero.sesion', null); }

/* ───────────── Carga de datos ───────────── */
async function cargarMes(mes) {
  try {
    S.d = await api('datos', { mes: mes || undefined });
  } catch (e) {
    if (!S.sesion) { S.estado = await api('estado').catch(() => null); return S.estado ? pantallaAcceso() : pantallaError(e.message); }
    if (!S.d) return pantallaError(e.message);
  }
  S.estado = { perfiles: S.d.perfiles, maxPerfiles: 2 };
  S.mes = S.d.mes;
  if (!S.calMes) { S.calMes = S.d.mesActual; S.calDia = S.d.hoy; }
  if (!S.fijosMes) { S.fijosMes = S.d.fijos.mes; S.fijos = S.d.fijos; }
  else if (S.fijosMes === S.d.fijos.mes) S.fijos = S.d.fijos;
  pintar();
}

const perfil = id => (S.d.perfiles.find(p => p.id === id) || { nombre: '—' });
const colorPerfil = id => S.d.perfiles.findIndex(p => p.id === id) === 1 ? 'var(--pb)' : 'var(--pa)';
const cat = id => S.d.categorias.find(c => c.id === id) || { nombre: 'Sin categoría', emoji: '•', color: '#8E8E93' };

/* ───────────── Pintado general ───────────── */
function pintar() {
  if (!S.d) return;
  const tabs = [['inicio', 'Inicio'], ['mio', 'Lo mío'], ['fijos', 'Fijos'], ['calendario', 'Calendario'], ['historico', 'Histórico']];
  const vistas = { inicio: vistaInicio, mio: vistaMio, fijos: vistaFijos, calendario: vistaCalendario, historico: vistaHistorico };
  $('#app').innerHTML = `<main class="page">${vistas[S.tab]()}</main>
    ${S.tab === 'inicio' || S.tab === 'mio' ? `<button class="fab" data-a="nuevo-gasto" aria-label="Añadir gasto">${ICON.plus}</button>` : ''}
    <div class="tabbar"><nav>${tabs.map(([k, n]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-a="tab" data-tab="${k}" aria-label="${n}">${ICON.tabs[k]}<span>${n}</span></button>`).join('')}</nav></div>`;
  if (S.tab === 'calendario') cargarEventos(S.calMes);
}

function cabeceraMes(titulo, extra = '') {
  const m = S.mes, max = S.d.mesActual;
  return `<header class="top"><h1 class="title"><small>${titulo}</small>${cap(mesNombre(m))}${m.slice(0, 4) !== max.slice(0, 4) ? ' ' + m.slice(0, 4) : ''}</h1>
    <div class="month-nav">${extra}<button class="icon-btn" data-a="mes" data-n="-1" aria-label="Mes anterior">${ICON.left}</button>
    <button class="icon-btn" data-a="mes" data-n="1" aria-label="Mes siguiente" ${m >= max ? 'disabled' : ''}>${ICON.right}</button></div></header>`;
}

/* ───────────── Inicio ───────────── */
function vistaInicio() {
  const d = S.d, b = d.balance, [pa, pb] = d.perfiles;
  let hero;
  if (d.perfiles.length < 2) {
    hero = `<div class="hero"><div class="hero-line">Falta el segundo perfil</div><div class="hero-amount peace">${eur(b.total)}</div>
      <div class="sub">en gastos comunes. El balance aparecerá cuando os registréis los dos.</div></div>`;
  } else {
    const va = b.porPerfil[pa.id] || 0, vb = b.porPerfil[pb.id] || 0, tot = va + vb;
    const frase = b.importe
      ? `<div class="hero-line"><b>${esc(perfil(b.deudor).nombre)}</b> le debe a <b>${esc(perfil(b.acreedor).nombre)}</b></div><div class="hero-amount num">${eur(b.importe)}</div>`
      : `<div class="hero-line">${b.total ? 'Este mes habéis puesto lo mismo' : 'Aún no hay gastos comunes'}</div><div class="hero-amount peace">Estáis en paz</div>`;
    let pie = '';
    if (b.saldado) {
      pie = `<span class="pill ok">✓ Saldado el ${fechaCorta(b.saldado.fecha)}</span><button class="link" data-a="deshacer-saldo" data-mes="${d.mes}">Deshacer</button>`;
    } else if (b.importe) {
      pie = `<span class="sub">${d.mes === d.mesActual ? 'Mes en curso' : 'Sin saldar'}</span><button class="btn tinted small" data-a="saldar" data-mes="${d.mes}">Marcar como saldado</button>`;
    }
    hero = `<div class="hero">${frase}<div class="sub">de ${eur(b.total)} en gastos comunes, a medias.</div>
      <div class="tug" aria-hidden="true"><div class="tug-bar"><span style="flex-grow:${tot ? va : 1};background:var(--pa)"></span><span style="flex-grow:${tot ? vb : 1};background:var(--pb)"></span></div><div class="tug-mid"></div></div>
      <div class="tug-legend"><div><span class="dot" style="background:var(--pa)"></span>${esc(pa.nombre)} <b class="num">${eur(va)}</b></div><div><b class="num">${eur(vb)}</b> ${esc(pb.nombre)}<span class="dot" style="background:var(--pb);margin:0 0 0 6px"></span></div></div>
      ${b.saldado && b.cambiado ? `<div class="warn" style="padding:12px 0 0">${ICON.warn}<span>El balance ha cambiado desde que se saldó (entonces eran ${eur(b.saldado.importe)}).</span></div>` : ''}
      ${pie ? `<div class="hero-foot">${pie}</div>` : ''}</div>`;
  }

  const f = d.fijos, faltan = f.items.length - f.rellenos;
  const fijosCard = `<button class="card pad" style="width:100%;text-align:left;display:block;margin-top:12px" data-a="ir-fijos" data-mes="${f.mes}">
    <div class="fx"><span class="sub">Fijos de ${mesNombre(f.mes)}</span><span class="big num">${eur(f.total)}</span></div>
    <div class="fx" style="margin-top:4px"><span>${f.rellenos ? `<b class="num">${eur(f.porPersona)}</b> cada uno a la cuenta conjunta` : 'Rellena los importes de este mes'}</span>${ICON.chev}</div>
    ${faltan ? `<div class="progress"><span style="width:${(f.rellenos / Math.max(1, f.items.length)) * 100}%"></span></div><div class="small" style="color:var(--orange);margin-top:8px">${faltan === 1 ? 'Falta 1 importe' : `Faltan ${faltan} importes`} por rellenar</div>` : ''}
  </button>`;

  const prox = d.proximos.length ? d.proximos.map(e => filaEvento(e)).join('') : `<div class="empty">No hay vencimientos en los próximos 60 días.</div>`;
  const comunes = d.comunes.slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || String(b.creado).localeCompare(String(a.creado)));

  return `${cabeceraMes('Gastos comunes', `<button class="icon-btn" data-a="ajustes" aria-label="Ajustes">${ICON.gear}</button>`)}
    <div class="card">${hero}</div>
    ${fijosCard}
    <div class="section-title">Próximos vencimientos <a href="#" data-a="tab" data-tab="calendario">Calendario</a></div>
    <div class="card">${prox}</div>
    ${comunes.length ? `<div class="section-title">Por categoría</div><div class="card">${donut(comunes)}</div>` : ''}
    <div class="section-title">Movimientos</div>
    <div class="card">${comunes.length ? comunes.map(filaGasto).join('') : `<div class="empty">Sin gastos comunes en ${mesNombre(d.mes)}. Pulsa + para añadir el primero.</div>`}</div>`;
}

function filaGasto(g) {
  const c = cat(g.categoria), mio = g.perfil === S.d.yo;
  const quien = g.tipo === 'comun' ? `<span class="who" style="background:${colorPerfil(g.perfil)}"></span>${esc(perfil(g.perfil).nombre)} · ` : '';
  return `<button class="row" ${mio ? `data-a="editar-gasto" data-id="${esc(g.id)}"` : 'data-a="ajeno"'}>
    <span class="ico" style="background:color-mix(in srgb, ${c.color} 18%, transparent)">${esc(c.emoji)}</span>
    <span class="grow"><div class="t">${esc(g.nota || c.nombre)}</div><div class="s">${quien}${fechaCorta(g.fecha)}${g.nota ? ' · ' + esc(c.nombre) : ''}</div></span>
    <span class="amt num">${eur(g.importe)}</span></button>`;
}

function filaEvento(e, borrable) {
  const pago = S.d.pagos.find(p => p.eventId === e.id || (e.serie && p.eventId === e.serie));
  return `<div class="row"><span class="datebox"><span>${MES_CORTO[Number(e.fecha.slice(5, 7)) - 1]}</span><b class="num">${Number(e.fecha.slice(8, 10))}</b></span>
    <span class="grow"><div class="t">${esc(e.titulo)}</div><div class="s">${diasHasta(e.fecha)}${e.hora ? ' · ' + e.hora : ''}</div></span>
    ${borrable && pago ? `<button class="link" style="color:var(--red)" data-a="borrar-pago" data-id="${esc(pago.id)}">Borrar</button>` : ''}</div>`;
}

function diasHasta(f) {
  const [y, m, d] = f.split('-').map(Number), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(y, m - 1, d) - hoy) / 86400000);
  return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n < 0 ? `Hace ${-n} días` : `En ${n} días`;
}

function donut(gastos) {
  const tot = {}, total = gastos.reduce((s, g) => (tot[g.categoria] = (tot[g.categoria] || 0) + g.importe, s + g.importe), 0);
  const items = Object.entries(tot).map(([id, v]) => ({ c: cat(id), v })).sort((a, b) => b.v - a.v);
  const R = 52, C = 2 * Math.PI * R, gap = items.length > 1 ? 3 : 0;
  let acc = 0;
  const arcs = items.map(({ c, v }) => {
    const len = (v / total) * C, seg = Math.max(0, len - gap);
    const a = `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${c.color}" stroke-width="16" stroke-dasharray="${seg} ${C - seg}" stroke-dashoffset="${-acc}" transform="rotate(-90 66 66)"/>`;
    acc += len; return a;
  }).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 132 132" role="img" aria-label="Gasto por categoría">${arcs}
      <text x="66" y="62" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">Total</text>
      <text x="66" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${esc(eur(total))}</text></svg>
    <div class="legend">${items.slice(0, 6).map(({ c, v }) => `<div><span class="dot" style="background:${c.color};margin:0"></span><span class="n">${esc(c.emoji)} ${esc(c.nombre)}</span><span class="v num">${Math.round(v / total * 100)}%</span></div>`).join('')}</div></div>`;
}

/* ───────────── Lo mío ───────────── */
function vistaMio() {
  const g = S.d.personales.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  const total = g.reduce((s, x) => s + x.importe, 0);
  return `${cabeceraMes('Lo mío')}
    <div class="card hero"><div class="hero-line">Tus gastos personales</div><div class="hero-amount num">${eur(total)}</div>
      <div class="sub">Solo los ves tú. No entran en el reparto.</div></div>
    ${g.length ? `<div class="section-title">Por categoría</div><div class="card">${donut(g)}</div>` : ''}
    <div class="section-title">Movimientos</div>
    <div class="card">${g.length ? g.map(filaGasto).join('') : `<div class="empty">Nada apuntado en ${mesNombre(S.d.mes)}. Pulsa + y elige «Personal».</div>`}</div>`;
}

/* ───────────── Fijos ───────────── */
function vistaFijos() {
  const f = S.fijos, m = S.fijosMes, lim = sumarMes(S.d.mesActual, 2);
  const filas = f.items.map(i => `<div class="frow">

function totalFijosEnVivo() {

async function irFijos(mes) {

/* ───────────── Calendario ───────────── */
function vistaCalendario() {
  const m = S.calMes, y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) - 1;
  const primero = new Date(y, mo, 1), offset = (primero.getDay() + 6) % 7, dias = new Date(y, mo + 1, 0).getDate();
  const evs = S.eventos[m] || [], porDia = {};
  evs.forEach(e => { (porDia[e.fecha] = porDia[e.fecha] || []).push(e); });
  const celdas = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, mo, i - offset + 1);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (i >= 35 && d.getMonth() !== mo) break;
    const n = (porDia[iso] || []).length;
    celdas.push(`<button class="day ${d.getMonth() !== mo ? 'out' : ''} ${iso === S.d.hoy ? 'today' : ''} ${iso === S.calDia ? 'sel' : ''}" data-a="dia" data-f="${iso}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}${n ? ', ' + n + ' eventos' : ''}">
      <span class="n">${d.getDate()}</span><span class="dots">${'<i></i>'.repeat(Math.min(n, 3))}</span></button>`);
  }
  const delDia = (porDia[S.calDia] || []);
  const [sy, sm, sd] = S.calDia.split('-').map(Number);
  const nombreDia = new Date(sy, sm - 1, sd).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<header class="top"><h1 class="title"><small>${y}</small>${cap(MESES[mo])}</h1>
      <div class="month-nav">${m !== S.d.mesActual ? `<button class="btn tinted small" data-a="cal-hoy">Hoy</button>` : ''}
      <button class="icon-btn" data-a="cal-mes" data-n="-1" aria-label="Mes anterior">${ICON.left}</button>
      <button class="icon-btn" data-a="cal-mes" data-n="1" aria-label="Mes siguiente">${ICON.right}</button></div></header>
    <div class="card cal"><div class="cal-head"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid">${celdas.join('')}</div>${S.eventos[m] ? '' : '<div class="small muted" style="text-align:center;padding-top:6px">Cargando eventos…</div>'}</div>
    <div class="section-title">${cap(nombreDia)}</div>
    <div class="card">${delDia.length ? delDia.map(e => filaEvento(e, true)).join('') : '<div class="empty">Nada este día.</div>'}</div>
    <button class="btn primary full" style="margin-top:16px" data-a="nuevo-pago">Añadir pago al calendario</button>
    <p class="small muted" style="margin:10px 4px 0">Cada pago avisa una semana antes y tres días antes, en el calendario compartido.</p>`;
}

async function cargarEventos(m, forzar) {
  if (S.eventos[m] && !forzar) return;
  const y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const desde = new Date(y, mo - 1, 1 - 7), hasta = new Date(y, mo, 7);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  try {
    S.eventos[m] = await api('eventos', { desde: iso(desde), hasta: iso(hasta) }, true);
  } catch (e) { S.eventos[m] = []; toast('No se pudieron cargar los eventos.', true); }
  if (S.tab === 'calendario' && S.calMes === m) pintar();
}

/* ───────────── Histórico ───────────── */
function vistaHistorico() {
  const h = S.d.historico;
  const tarjetas = h.map(x => {
    const b = x.balance;
    const frase = b.importe ? `${esc(perfil(b.deudor).nombre)} le debía <b class="num">${eur(b.importe)}</b> a ${esc(perfil(b.acreedor).nombre)}` : 'Estabais en paz';
    const pill = x.estado === 'saldado' ? `<span class="pill ok">✓ Saldado</span>` : x.estado === 'pendiente' ? `<span class="pill wait">Pendiente</span>` : `<span class="pill even">En paz</span>`;
    return `<div class="card"><button class="row plain" data-a="ver-mes" data-mes="${x.mes}"><span class="grow"><div class="t" style="font-weight:600">${mesLargo(x.mes)}</div>
        <div class="s" style="white-space:normal">${frase} · comunes ${eur(b.total)}</div><div class="s">Tus personales: ${eur(x.miPersonal)}</div></span>${pill}</button>
      ${b.saldado && b.cambiado ? `<div class="warn" style="padding:0 16px 12px">${ICON.warn}<span>Cambió tras saldarse: ahora son ${eur(b.importe)} (se saldaron ${eur(b.saldado.importe)}).</span></div>` : ''}

  }).join('');
  return `<header class="top"><h1 class="title"><small>Meses cerrados</small>Histórico</h1></header>
    ${tarjetas || '<div class="card"><div class="empty">Aquí aparecerán los meses anteriores con su balance y si están saldados.</div></div>'}`;

/* ───────────── Acciones ───────────── */
const A = {
  async 'reintentar'() { iniciar(); },
  'cambiar-api'() { guardar('ninero.api', null); S.api = API_URL; if (S.api) toast('La URL está fijada en index.html.'); pantallaApi(); },
  'guardar-api'() {
    const v = $('#api-url').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) return toast('La URL debe empezar por https://script.google.com y terminar en /exec', true);
    S.api = v; guardar('ninero.api', v); iniciar();
  },
  'elegir-perfil'(el) { pantallaPin(el.dataset.id); },
  'registro'() { pantallaRegistro(false); },
  'volver-acceso'() { pantallaAcceso(); },
  async 'registrar'() {
    const nombre = $('#r-nombre').value.trim(), p1 = $('#r-pin').value, p2 = $('#r-pin2').value, email = $('#r-email').value.trim();
    if (!nombre) return toast('Pon tu nombre.', true);
    if (!/^\d{4,6}$/.test(p1)) return toast('El PIN debe tener entre 4 y 6 números.', true);
    if (p1 !== p2) return toast('Los PIN no coinciden.', true);
    const r = await api('registrar', { nombre, pin: p1, email });
    S.sesion = { token: r.token, perfil: r.perfil }; guardar('ninero.sesion', S.sesion);
    toast(r.calendarioCompartido ? 'Perfil creado. Te hemos compartido el calendario.' : 'Perfil creado.');
    cargarMes();
  },
  'pin'(el) { if (pin.length < 6) { pin += el.dataset.k; pintarDots(); } },
  'pin-borrar'() { pin = pin.slice(0, -1); pintarDots(); },
  async 'pin-ok'() {
    if (pin.length < 4) return;
    try {
      const r = await api('login', { perfil: pinPerfil.id, pin }, true);

      cargarMes();

      pin = ''; pintarDots(); const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      toast(e.message, true);
    }
  },
  'tab'(el) { S.tab = el.dataset.tab; if (S.tab === 'fijos') S.fijosEdit = false; pintar(); window.scrollTo(0, 0); },
  async 'mes'(el) { await cargarMes(sumarMes(S.mes, Number(el.dataset.n))); },
  async 'ver-mes'(el) { S.tab = 'inicio'; await cargarMes(el.dataset.mes); window.scrollTo(0, 0); },
  'ir-fijos'(el) { S.fijosEdit = false; irFijos(el.dataset.mes); },
  async 'fijos-mes'(el) { S.fijosEdit = false; await irFijos(sumarMes(S.fijosMes, Number(el.dataset.n))); },
  'fijos-editar'() { S.fijosEdit = !S.fijosEdit; pintar(); },
  async 'add-fijo'() {
    const n = $('#fx-nuevo').value.trim(); if (!n) return;
    await api('addFijo', { nombre: n }); S.fijos = await api('fijos', { mes: S.fijosMes }); pintar();
  },
  async 'borrar-fijo'(el) {
    if (!confirm(`¿Quitar «${el.dataset.n}» de la lista de fijos?`)) return;
    await api('borrarFijo', { nombre: el.dataset.n }); S.fijos = await api('fijos', { mes: S.fijosMes }); pintar();
  },
  async 'guardar-fijos'() {
    const importes = {};
    for (const i of document.querySelectorAll('[data-fijo]')) {
      const raw = i.value.trim();
      if (raw && !(parseImporte(raw) >= 0)) return toast(`Revisa el importe de ${i.dataset.fijo}.`, true);
      importes[i.dataset.fijo] = raw ? parseImporte(raw) : '';
    }
    S.fijos = await api('setFijos', { mes: S.fijosMes, importes });
    toast(`Fijos de ${mesNombre(S.fijosMes)} guardados`);
    cargarMes(S.mes);
  },
  async 'copiar-fijos'() {
    const prev = await api('fijos', { mes: sumarMes(S.fijosMes, -1) });
    if (!prev.rellenos) return toast(`${cap(mesNombre(prev.mes))} no tiene importes que copiar.`, true);
    prev.items.forEach(i => { const el = document.querySelector(`[data-fijo="${CSS.escape(i.nombre)}"]`); if (el && i.importe !== null) el.value = String(i.importe).replace('.', ','); });
    totalFijosEnVivo(); toast('Copiados. Revisa y pulsa «Guardar importes».');
  },
  'nuevo-gasto'() { hojaGasto(null); },
  'editar-gasto'(el) { hojaGasto([...S.d.comunes, ...S.d.personales].find(g => g.id === el.dataset.id)); },
  'ajeno'() { toast('Solo puede cambiarlo quien lo apuntó.'); },
  'g-tipo'(el) { G.tipo = el.dataset.t; pintarGastoForm(); },

  async 'borrar-gasto'() {

    const m = el.dataset.mes;

    if (!confirm('¿Quitar la marca de saldado?')) return;
    await api('deshacerSaldo', { mes: el.dataset.mes }); cargarMes(S.mes);
  },
  'cal-mes'(el) { S.calMes = sumarMes(S.calMes, Number(el.dataset.n)); S.calDia = S.calMes === S.d.mesActual ? S.d.hoy : S.calMes + '-01'; pintar(); },
  'cal-hoy'() { S.calMes = S.d.mesActual; S.calDia = S.d.hoy; pintar(); },
  'dia'(el) {
    S.calDia = el.dataset.f; const m = S.calDia.slice(0, 7);
    if (m !== S.calMes) S.calMes = m;
    pintar();
  },
  'nuevo-pago'() { hojaPago(); },
  'toggle'(el) { el.classList.toggle('on'); el.setAttribute('aria-checked', el.classList.contains('on')); },
  async 'guardar-pago'(el) {
    const titulo = $('#p-titulo').value.trim(), fecha = $('#p-fecha').value, raw = $('#p-importe').value.trim();
    if (!titulo) return toast('Pon el concepto.', true);
    if (!fecha) return toast('Pon la fecha de vencimiento.', true);
    if (raw && !(parseImporte(raw) >= 0)) return toast('Revisa el importe.', true);
    el.disabled = true;
    try {
      await api('addPago', { titulo, fecha, importe: raw ? parseImporte(raw) : '', anual: $('#p-anual').classList.contains('on') });
      cerrarHoja(); toast('Añadido al calendario con sus avisos');
      S.eventos = {}; S.calMes = fecha.slice(0, 7); S.calDia = fecha;
      await cargarMes(S.mes);
    } finally { el.disabled = false; }
  },
  async 'borrar-pago'(el) {
    if (!confirm('¿Borrar este pago del calendario?')) return;
    await api('borrarPago', { id: el.dataset.id }); S.eventos = {}; toast('Pago borrado'); cargarMes(S.mes);
  },
  'ajustes'() { hojaAjustes(); },
  'cerrar'() { cerrarHoja(); },
  'editar-cat'(el) { hojaCategoria(S.d.categorias.find(c => c.id === el.dataset.id)); },
  'nueva-cat'(el) { hojaCategoria(null, el.dataset.t); },
  'c-color'(el) { CAT.color = el.dataset.c; pintarColores(); },
  async 'guardar-cat'() {
    const nombre = $('#c-nombre').value.trim(); if (!nombre) return toast('Ponle un nombre.', true);
    await api(CAT.id ? 'editCategoria' : 'addCategoria', { id: CAT.id, tipo: CAT.tipo, nombre, emoji: $('#c-emoji').value.trim() || '•', color: CAT.color });
    await cargarMes(S.mes); hojaAjustes();
  },
  async 'borrar-cat'() {
    if (!confirm(`¿Borrar la categoría «${CAT.nombre}»? Los gastos que la usan quedarán «Sin categoría».`)) return;
    await api('borrarCategoria', { id: CAT.id }); await cargarMes(S.mes); hojaAjustes();
  },
  async 'cambiar-pin'() {
    const a = $('#pin-a').value, n = $('#pin-n').value;
    if (!/^\d{4,6}$/.test(n)) return toast('El PIN nuevo debe tener entre 4 y 6 números.', true);
    await api('cambiarPin', { actual: a, nuevo: n }); toast('PIN cambiado'); $('#pin-a').value = ''; $('#pin-n').value = '';
  },
  async 'salir'() {
    if (!confirm('¿Cerrar sesión en este móvil?')) return;
    api('logout', {}, true).catch(() => {});
    cerrarSesionLocal(); cerrarHoja(); S.estado = null; iniciar();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (e.target.id === 'scrim') cerrarHoja(); return; }
  if (el.tagName === 'A') e.preventDefault();
  const f = A[el.dataset.a];
  if (f) Promise.resolve(f(el)).catch(() => {});
});
document.addEventListener('input', e => {
  if (e.target.id === 'g-importe') pintarHint();
  if (e.target.dataset && e.target.dataset.fijo !== undefined) totalFijosEnVivo();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarHoja();
  if (!$('#dots')) return;
  if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; pintarDots(); }
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); pintarDots(); }
  if (e.key === 'Enter') A['pin-ok']();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.sesion && S.d && $('#sheet').classList.contains('hidden')) {
    S.eventos = {}; cargarMes(S.mes);
  }
});

iniciar();
</script>
</body>
</html>
